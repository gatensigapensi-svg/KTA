  push:
    branches: [ master ]
  schedule:
    - cron: "*/10 * * * *" 
  workflow_dispatch:

env:
  DATABASE_URL="mysql://gatensi:GatensiDB%40%24%23%212025@localhost:3306/gatensi_kta"
  MIDTRANS_CLIENT_KEY="Mid-client-1Dtlrk1yjQXT-wHW"
  MIDTRANS_ENVIRONMENT="sandbox"
  MIDTRANS_MERCHANT_ID="G355561914"
  MIDTRANS_SERVER_KEY="Mid-server-iC9LOY_B7_SB1UpAjBRrctvt"
  NEXTAUTH_SECRET="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiYWRtaW4iOnRydWUsImlhdCI6MTUxNjIzOTAyMn0.KMUFsIDTnFmyG3nMiGM6H9FNFUROf3wh7SmqJp-QV30"
  NEXTAUTH_URL="kta.Gatensi.or.id"
  NEXT_PUBLIC_SITE_URL="kta.Gatensi.or.id"
  SIKI_API_TOKEN="f3332337ac671c33262198340c2f7b579f7843775ecc425107f086956cbb2b1a9e96b0cc6f643d24"

jobs:

# -------- SYNC UPSTREAM --------

  sync:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/alvinsdrive2-stack/KTA.git || true
          git fetch upstream
          git checkout master
          git merge upstream/master --no-edit

      - name: Push sync branch
        run: |
          git push origin master --force

# -------- BUILD & DEPLOY --------

  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Deploy to server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT }} ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

          rsync -avz --delete \
            --exclude=".git" \
            $GITHUB_WORKSPACE/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

          ssh -p ${{ secrets.DEPLOY_PORT }} \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
              cd $DEPLOY_PATH
              pm2 restart ekta-dummy
            EOF
